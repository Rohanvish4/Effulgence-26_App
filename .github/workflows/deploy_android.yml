name: Deploy to Google Play

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # Securely handle files without manual 'echo' or 'base64' commands
      - name: Setup Android Credentials
        run: |
          # Create the key.properties file directly
          echo "${{ secrets.ANDROID_KEY_PROPERTIES }}" > android/key.properties
          
          # Save the Keystore and Service Account to files
          # We use printf to avoid trailing newline issues that break Base64
          printf "%s" "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
          printf "%s" "${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}" > android/service_account.json

      - name: Build App
        run: |
          flutter pub get
          flutter build appbundle --release

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          # Point directly to the file we created in the Setup step
          serviceAccountJson: android/service_account.json
          packageName: in.effulgence26.app
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: beta
          status: draft