name: Deploy to Google Play

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:

      # Checkout source
      - uses: actions/checkout@v4


      # Java required for Android build
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17


      # Flutter setup with cache for faster builds
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true


      # Decode keystore (Base64 → .jks)
      - name: Decode Android Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks


      # Recreate key.properties
      - name: Create key.properties
        run: |
          echo "${{ secrets.ANDROID_KEY_PROPERTIES }}" > android/key.properties


          # Decode service account JSON (Base64 → .json)
      - name: Decode Service Account JSON
        run: |
          echo "${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}" | base64 --decode > android/service_account.json

      - name: Verify Service Account JSON
        run: |
          if [ ! -s android/service_account.json ]; then
            echo "Error: android/service_account.json is empty or does not exist."
            exit 1
          fi
          echo "android/service_account.json size: $(wc -c < android/service_account.json) bytes"
          if ! jq -e . android/service_account.json >/dev/null 2>&1; then
             echo "Error: android/service_account.json is not valid JSON."
             # Do NOT print the content for security, but maybe print the first few chars if really needed, be careful
             exit 1
          fi
          echo "android/service_account.json is valid JSON."


      # Install dependencies
      - name: Get Dependencies
        run: flutter pub get


      # Optional but recommended
      - name: Run Tests
        run: flutter test


      # Build signed release bundle
      - name: Build App Bundle
        run: flutter build appbundle --release


      # Upload to Google Play (Closed testing)
      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: android/service_account.json
          packageName: in.effulgence26.app
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: beta        # Closed testing
          status: draft      # change to completed for auto publish
