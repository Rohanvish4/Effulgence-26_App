name: Deploy to Google Play

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:

      # Checkout source
      - uses: actions/checkout@v4


      # Java required for Android build
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17


      # Flutter setup with cache for faster builds
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true


      # Decode keystore (Base64 → .jks)
      - name: Decode Android Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks


      # Recreate key.properties
      - name: Create key.properties
        run: |
          echo "${{ secrets.ANDROID_KEY_PROPERTIES }}" > android/key.properties


      # Decode service account JSON (Base64 → .json) or handling Raw JSON
      - name: Extract Service Account JSON
        id: extract_service_account
        run: |
          # Save the secret to a temporary file
          echo "${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}" > android/service_account_raw
          
          echo "Debug Info:"
          echo "  File size: $(wc -c < android/service_account_raw) bytes"
          # Print first 5 chars to guess format (safe to reveal start chars usually)
          # We use subshell to avoid newline issues and pipe correctly
          HEAD_CHARS=$(head -c 5 android/service_account_raw)
          echo "  First 5 chars: '$HEAD_CHARS'"
          
          # Attempt 1: Try to decode as Base64 and check if it is valid JSON
          echo "Attempting Base64 decode..."
          if base64 --decode android/service_account_raw > android/service_account_decoded.json 2>base64_error.log; then
            if jq -e . android/service_account_decoded.json >/dev/null 2>&1; then
              echo "✅ Success: Secret is Base64 encoded JSON."
              mv android/service_account_decoded.json android/service_account.json
              echo "Resulting JSON size: $(wc -c < android/service_account.json) bytes"
              exit 0
            else
              echo "  Base64 decode succeeded, but result is not valid JSON."
            fi
          else
            echo "  Base64 decode failed."
          fi
          
          # Attempt 2: Check if the raw secret is already valid JSON
          echo "Attempting Raw JSON check..."
          if jq -e . android/service_account_raw >jq_error.log 2>&1; then
             echo "✅ Success: Secret is Raw JSON."
             mv android/service_account_raw android/service_account.json
             echo "Resulting JSON size: $(wc -c < android/service_account.json) bytes"
             exit 0
          else
             echo "  Raw content is not valid JSON. JSON Error:"
             cat jq_error.log
          fi
          
          # Failure Analysis
          echo "❌ Error: Could not extract valid JSON from GOOGLE_PLAY_SERVICE_ACCOUNT_JSON."
          
          # Check for common issues
          if grep -q "^MII" android/service_account_raw; then
             echo "⚠️  Diagnosis: The secret starts with 'MII...', which usually indicates a Base64 encoded PKCS12 (.p12) key or private key."
             echo "   The 'upload-google-play' action requires a JSON service account key."
             echo "   Please generate a new JSON key from the Google Cloud Console and add it to your secrets."
          elif [[ "$HEAD_CHARS" == "{"* ]]; then
              echo "⚠️  Diagnosis: Starts with '{', so it looks like JSON but 'jq' failed to parse it. Check for invalid characters or truncation."
          elif [ ! -s android/service_account_raw ]; then
             echo "⚠️  Diagnosis: The secret GOOGLE_PLAY_SERVICE_ACCOUNT_JSON appears to be empty."
          else
             echo "⚠️  Diagnosis: The secret content format is unrecognized (neither valid JSON nor Base64-encoded JSON)."
             echo "   Debugging tip: Make sure you copied the entire JSON content including curly braces."
          fi
          
          exit 1


      # Install dependencies
      - name: Get Dependencies
        run: flutter pub get


      # Build signed release bundle
      - name: Build App Bundle
        run: flutter build appbundle --release


      # Upload to Google Play (Closed testing)
      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: android/service_account.json
          packageName: in.effulgence26.app
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: beta        # Closed testing
          status: draft      # change to completed for auto publish
